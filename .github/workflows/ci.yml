name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: python -m pytest -q

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t medvani-ai .
      - name: Smoke test the container
        run: |
          docker run -d --name api -p 8000:8000 medvani-ai
          for i in $(seq 1 30); do curl -fs localhost:8000/health && break || sleep 2; done
          curl -fs localhost:8000/ready
          curl -fs -X POST localhost:8000/api/v1/consult -H 'Content-Type: application/json' \
            -d '{"query":"fever and cough for 4 days"}'
