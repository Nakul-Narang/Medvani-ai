[project]
name = "medvani-ai"
version = "1.0.0"
description = "Multilingual medical-information RAG pipeline with deterministic safety rules"
requires-python = ">=3.11"
readme = "README.md"
license = { text = "MIT" }

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
